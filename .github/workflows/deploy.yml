name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - developing
  schedule:
    - cron: '0 5 * * 3'   # Wednesday 05:00 UTC = 07:00 Madrid (summer) / 06:00 (winter)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3'

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Build Swift package
        run: swift build -c release

      - name: Generate site
        run: .build/release/PortfolioSite

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler pages deploy deploy/ --project-name=jcalderita
          else
            npx wrangler pages deploy deploy/ --project-name=jcalderita --branch=staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  announce:
    needs: build-and-deploy
    if: (github.ref_name == 'main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || github.ref_name == 'developing'
    uses: ./.github/workflows/social.yml
    with:
      dry_run: ${{ github.ref_name != 'main' }}
    secrets: inherit
