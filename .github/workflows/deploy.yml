name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - developing
  schedule:
    - cron: '17 5 * * 3'   # Wednesday 05:17 UTC — off-the-hour to dodge GitHub's congested :00 queue; ≈07:17 Madrid (summer) / 06:17 (winter)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: swift:6.3-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Install system dependencies
        run: apt-get update && apt-get install -y webp libjavascriptcoregtk-4.1-dev

      - name: Build Swift package
        run: swift build -c release

      - name: Generate site
        run: .build/release/PortfolioSite

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler pages deploy deploy/ --project-name=jcalderita
          else
            npx wrangler pages deploy deploy/ --project-name=jcalderita --branch=staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Announce on social media
        if: (github.ref_name == 'main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || github.ref_name == 'developing'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          FLAG=""
          [ "${{ github.ref_name }}" != "main" ] && FLAG="--dry-run"
          .build/release/SocialAnnouncer $FLAG
